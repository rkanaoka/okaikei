# ─── Bodogami — VPS Hostinger (Cardápio Digital) ──────────────────────────────
# Versão adaptada para o Docker Manager da Hostinger com Traefik integrado.
# NÃO usa nginx próprio — o Traefik da Hostinger gerencia SSL e roteamento.
#
# Deploy:
#   docker compose -f docker-compose.hostinger.yml --env-file .env.vps up -d --build
#
# Antes do primeiro deploy, descubra o nome da rede do Traefik:
#   docker network ls | grep traefik
# e ajuste o campo `name:` em networks.traefik abaixo se necessário.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Rede interna entre os containers do Okaikei
  okaikei_internal:
    driver: bridge

  # Rede externa do Traefik (gerenciada pela Hostinger).
  # Verifique o nome exato com: docker network ls | grep traefik
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_default}

volumes:
  redis_vps_data:

services:

  # ── Redis (cache do cardápio) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: okaikei_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_vps_data:/data
    networks:
      - okaikei_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── VPS API (gateway + cache) ─────────────────────────────────────────────────
  # Rotas: /api/* → vps-api (prioridade 10)
  vps-api:
    build:
      context: ./vps-api
      dockerfile: Dockerfile
    image: okaikei/vps-api:latest
    container_name: okaikei_vps_api
    restart: unless-stopped
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL}
      LOCAL_API_KEY: ${LOCAL_API_KEY}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    networks:
      - okaikei_internal
      - traefik
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}"
      # Rota /api/* → vps-api (prioridade alta)
      - "traefik.http.routers.okaikei-api.rule=Host(`${CARDAPIO_DOMAIN:-cardapio.bodogami.tech}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.okaikei-api.entrypoints=websecure"
      - "traefik.http.routers.okaikei-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.okaikei-api.priority=10"
      - "traefik.http.services.okaikei-api.loadbalancer.server.port=4000"
      # /internal/* → vps-api, mas bloqueado a IPs externos (middleware IP whitelist)
      - "traefik.http.routers.okaikei-internal.rule=Host(`${CARDAPIO_DOMAIN:-cardapio.bodogami.tech}`) && PathPrefix(`/internal`)"
      - "traefik.http.routers.okaikei-internal.entrypoints=websecure"
      - "traefik.http.routers.okaikei-internal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.okaikei-internal.priority=20"
      - "traefik.http.routers.okaikei-internal.middlewares=vpn-only@docker"
      - "traefik.http.services.okaikei-internal.loadbalancer.server.port=4000"
      # Middleware: libera /internal apenas para IPs WireGuard (ajuste o range)
      - "traefik.http.middlewares.vpn-only.ipwhitelist.sourcerange=${WIREGUARD_CIDR:-10.0.0.0/8}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Cardápio App (SPA React) ──────────────────────────────────────────────────
  # Rotas: /* → cardapio-app (prioridade baixa / catch-all)
  cardapio-app:
    build:
      context: ./cardapio-app
      dockerfile: Dockerfile
    image: okaikei/cardapio-app:latest
    container_name: okaikei_cardapio_app
    restart: unless-stopped
    networks:
      - okaikei_internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}"
      # Catch-all para o domínio (prioridade baixa — /api/* vai para vps-api)
      - "traefik.http.routers.okaikei-app.rule=Host(`${CARDAPIO_DOMAIN:-cardapio.bodogami.tech}`)"
      - "traefik.http.routers.okaikei-app.entrypoints=websecure"
      - "traefik.http.routers.okaikei-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.okaikei-app.priority=1"
      - "traefik.http.services.okaikei-app.loadbalancer.server.port=80"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.okaikei-app-http.rule=Host(`${CARDAPIO_DOMAIN:-cardapio.bodogami.tech}`)"
      - "traefik.http.routers.okaikei-app-http.entrypoints=web"
      - "traefik.http.routers.okaikei-app-http.middlewares=https-redirect@docker"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
