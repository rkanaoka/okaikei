# ─── Bodogami — Local-First POS ───────────────────────────────────────────────
# Todos os serviços rodam na LAN. Sem internet = sem problema.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  bodogami:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:
  backup_data:

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: "postgres:16.0-alpine3.18"
    env_file:
      - .env.development
    container_name: bodogami_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - bodogami
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodogami -d bodogami_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bodogami_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bodogami
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NATS (mensageria local) ───────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: bodogami_nats
    restart: unless-stopped
    command: >
      -js
      -sd /data
      --auth ${NATS_TOKEN:-nats_secret}
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    networks:
      - bodogami
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 4222"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: bodogami_backend
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      NODE_ENV:     development
      PORT:         3001
      # Sobrescreve os valores do env_file — dentro do Docker o host é o nome do serviço, não localhost
      DATABASE_URL: postgresql://bodogami:bodogami_secret@postgres:5432/bodogami_local
      REDIS_URL:    redis://:redis_secret@redis:6379
      NATS_URL:     nats://nats_secret@nats:4222
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    networks:
      - bodogami
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_started }
    # node_modules é volume anônimo — sempre que o container é recriado ele volta
    # ao estado da imagem, perdendo o Prisma Client de um `db push`/`generate` manual.
    # Gerar o client no boot garante que ele nunca fique desatualizado com o schema.
    command: sh -c "npx prisma generate && npm run start:dev"

  # ── Frontend (React + Vite) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: bodogami_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost/api
      VITE_WS_URL:  ws://localhost/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - bodogami
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # ── Backup Worker ─────────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: bodogami_backup
    restart: unless-stopped
    environment:
      PGPASSWORD:    ${POSTGRES_PASSWORD:-bodogami_secret}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-bodogami}
      POSTGRES_DB:   ${POSTGRES_DB:-bodogami_local}
      CLOUD_BACKUP_URL: ${CLOUD_BACKUP_URL:-}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - bodogami
    depends_on:
      postgres: { condition: service_healthy }
    # Rode manualmente: docker compose run --rm backup /backup.sh
    entrypoint: ["sh", "-c", "echo 'Backup container pronto. Rode: docker compose run --rm backup /backup.sh' && sleep infinity"]

  # ── Nginx (proxy reverso) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bodogami_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - bodogami
    depends_on:
      - backend
      - frontend
