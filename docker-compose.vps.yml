# ─── Bodogami — VPS Hostinger (Cardápio Digital Público) ──────────────────────
# Deploy: docker compose -f docker-compose.vps.yml --env-file .env.vps up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  bodogami_vps:
    driver: bridge

volumes:
  redis_vps_data:

services:

  # ── Redis (cache do cardápio) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bodogami_vps_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_vps_secret}
      --appendonly yes
    volumes:
      - redis_vps_data:/data
    networks:
      - bodogami_vps
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_vps_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── VPS API (gateway + cache) ─────────────────────────────────────────────────
  vps-api:
    build:
      context: ./vps-api
      dockerfile: Dockerfile
    container_name: bodogami_vps_api
    restart: unless-stopped
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_vps_secret}
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL}      # ex: http://10.0.0.1:3000 (WireGuard)
      LOCAL_API_KEY: ${LOCAL_API_KEY}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    networks:
      - bodogami_vps
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Cardápio App (SPA React) ──────────────────────────────────────────────────
  cardapio-app:
    build:
      context: ./cardapio-app
      dockerfile: Dockerfile
    container_name: bodogami_cardapio_app
    restart: unless-stopped
    networks:
      - bodogami_vps

  # ── Nginx (reverse proxy público) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bodogami_vps_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-vps/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-vps/ssl:/etc/nginx/ssl:ro        # certificados Let's Encrypt
    networks:
      - bodogami_vps
    depends_on:
      - vps-api
      - cardapio-app
