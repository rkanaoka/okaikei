# ─── Bodogami — Produção (servidor local do restaurante) ──────────────────────
# Deploy: make -f Makefile.prod up   (ver Makefile.prod, não versionado)
#
# Diferenças em relação ao docker-compose.yml de desenvolvimento:
#   - builds usam target: production (sem hot-reload, sem código-fonte montado)
#   - Postgres/Redis/NATS não publicam portas no host — só acessíveis pela rede
#     interna do Docker; use `docker compose exec` para acesso administrativo
#   - senhas/tokens vêm de .env sem fallback fraco (falha se não estiverem setados)
#   - nginx serve o build estático do frontend, não o servidor de dev do Vite
# ─────────────────────────────────────────────────────────────────────────────

networks:
  bodogami_prod:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  nats_prod_data:
  backup_prod_data:

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: "postgres:16.0-alpine3.18"
    env_file:
      - .env
    container_name: bodogami_prod_postgres
    restart: unless-stopped
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bodogami_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bodogami_prod_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definido em .env}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_prod_data:/data
    networks:
      - bodogami_prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definido em .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NATS (mensageria local) ───────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: bodogami_prod_nats
    restart: unless-stopped
    command: >
      -js
      -sd /data
      --auth ${NATS_TOKEN:?NATS_TOKEN precisa estar definido em .env}
    volumes:
      - nats_prod_data:/data
    networks:
      - bodogami_prod
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 4222"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bodogami_prod_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Dentro do Docker o host é o nome do serviço, não localhost — sobrescreve .env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_TOKEN}@nats:4222
    networks:
      - bodogami_prod
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_started }
    # migrate deploy é idempotente e nunca aplica mudança destrutiva sem migration
    # explícita — seguro rodar a cada start. Requer migrations já commitadas em
    # backend/prisma/migrations (ver aviso de segurança separado).
    command: sh -c "npx prisma migrate deploy && node dist/main"

  # ── Frontend (build estático servido por nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: bodogami_prod_frontend
    restart: unless-stopped
    networks:
      - bodogami_prod
    depends_on:
      - backend

  # ── Backup Worker ─────────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: bodogami_prod_backup
    restart: unless-stopped
    environment:
      PGPASSWORD:    ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB:   ${POSTGRES_DB}
      CLOUD_BACKUP_URL: ${CLOUD_BACKUP_URL:-}
      CLOUD_API_KEY:    ${CLOUD_API_KEY:-}
    volumes:
      - backup_prod_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - bodogami_prod
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["sh", "-c", "echo 'Backup container pronto. Rode: make -f Makefile.prod backup' && sleep infinity"]

  # ── Nginx (proxy reverso) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bodogami_prod_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - bodogami_prod
    depends_on:
      - backend
      - frontend
