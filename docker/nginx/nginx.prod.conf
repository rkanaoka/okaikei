worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;

  server_tokens off;

  # DNS interno do Docker. Com proxy_pass usando variáveis, o nginx resolve os
  # nomes a cada requisição (cache de 10s) em vez de só na inicialização — assim
  # um backend/frontend recriado com outro IP não deixa o proxy apontando para o
  # IP antigo (sintoma: 502 "Connection refused" para outro container).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    set $backend_upstream  backend:3001;
    set $frontend_upstream frontend:80;

    # ── API REST ──────────────────────────────────────────────────────────────
    location /api/ {
      # Remove o prefixo /api (equivalente ao antigo "proxy_pass http://backend/;")
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
      proxy_pass         http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 3600s;
    }

    # ── Frontend (build estático servido pelo próprio nginx do container) ──────
    location / {
      proxy_pass         http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
