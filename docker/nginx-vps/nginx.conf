worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── Segurança ────────────────────────────────────────────────────────────────
  server_tokens off;
  add_header X-Frame-Options DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer-when-downgrade;

  # ── Gzip ────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_types
    text/plain text/css application/json application/javascript
    application/x-javascript text/xml application/xml image/svg+xml;

  # ── Rate limit global ─────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=pedidos:10m rate=5r/m;

  # ── Redireciona HTTP → HTTPS ──────────────────────────────────────────────
  server {
    listen 80;
    server_name cardapio.bodogami.com.br;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS principal ────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name cardapio.bodogami.com.br;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── API pública → vps-api ─────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=10 nodelay;

      proxy_pass         http://vps-api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 15s;

      # CORS (redunda com o Fastify, mas garante em nível nginx)
      add_header Access-Control-Allow-Origin  *;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
      add_header Access-Control-Allow-Headers "Content-Type";
      if ($request_method = OPTIONS) { return 204; }
    }

    # Rate limit extra no endpoint de criar pedidos
    location = /api/pedidos {
      limit_req zone=pedidos burst=3 nodelay;
      proxy_pass         http://vps-api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Endpoint interno (não exposto externamente) ──────────────────────────
    location /internal/ {
      # Bloqueia acesso externo — só o backend local (WireGuard) pode chamar
      allow 10.0.0.0/8;
      deny  all;

      proxy_pass         http://vps-api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
    }

    # ── Cardápio App (SPA React) → cardapio-app ───────────────────────────
    location / {
      proxy_pass         http://cardapio-app:80;
      proxy_http_version 1.1;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;

      # Cache de assets estáticos
      location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass         http://cardapio-app:80;
        proxy_cache_valid  200 30d;
        add_header         Cache-Control "public, max-age=2592000, immutable";
      }
    }
  }
}
